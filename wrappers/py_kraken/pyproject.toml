[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-kraken"
version = "0.1.0"
description = "Python bindings, readers, and plots for OpenOceanKraken"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pydantic>=2",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["py_kraken"]
include-package-data = true

[tool.setuptools.package-data]
py_kraken = ["*.pyd", "*.so", "*.dll", "*.pyi", "py.typed"]
